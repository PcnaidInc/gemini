name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          # Check every tracked JavaScript module, including the Netlify
          # deployment entry points, so a parse error cannot slip past CI.
          git ls-files -z '*.mjs' '*.js' '*.cjs' | xargs -0 -n1 node --check